            platform: darwin-arm64
            macos_arch: arm64
          - runner: macos-14
            platform: darwin-amd64
            macos_arch: x86_64
          - runner: ubuntu-latest
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-latest
            platform: windows-amd64
          - runner: windows-latest
            platform: windows-arm64
            cross_compile_target: aarch64
          - runner: ubuntu-latest
            platform: linux-riscv64
            cross: riscv64
          - runner: ubuntu-latest
            platform: wasm
            wasm: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.platform == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install cross-compilation tools (linux-riscv64)
        # Rust's riscv64gc-unknown-linux-gnu target (build-naga.sh adds it)
        # links with Ubuntu's cross gcc.
        if: matrix.cross == 'riscv64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-riscv64-linux-gnu libc6-dev-riscv64-cross libstdc++-13-dev-riscv64-cross binutils-riscv64-linux-gnu

      # ---- Windows MinGW toolchain ----
      # Rust now targets *-pc-windows-gnu(llvm) on Windows to match the
      # ABI of the rest of the redistributable stack (glslang, spirv-cross,
      # etc.) and libmental's downstream MinGW build.  That requires the
      # MinGW linker on PATH:
      #   - x86_64-pc-windows-gnu     → x86_64-w64-mingw32-gcc (MSYS2 MINGW64)
      #   - aarch64-pc-windows-gnullvm → aarch64-w64-mingw32-clang (llvm-mingw)
      - name: Setup MinGW (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          cache: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc

      - name: Cache llvm-mingw (Windows arm64)
        if: matrix.cross_compile_target == 'aarch64'
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: llvm-mingw-20260311-ucrt-x86_64
          key: llvm-mingw-20260311-ucrt-x86_64

      - name: Download llvm-mingw (Windows arm64)
        if: matrix.cross_compile_target == 'aarch64' && steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # llvm-mingw provides the aarch64-w64-mingw32-clang linker that
          # the aarch64-pc-windows-gnullvm Rust target requires.
          curl -L -o llvm-mingw.zip https://github.com/mstorsjo/llvm-mingw/releases/download/20260311/llvm-mingw-20260311-ucrt-x86_64.zip
          unzip -q llvm-mingw.zip

      - name: Install Emscripten (WASM)
        if: matrix.wasm
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "5.0.1"

      - name: Build Naga (WASM)
        if: matrix.wasm
        run: |
          chmod +x scripts/build-naga-wasm.sh
          BUILD_DIR="${{ runner.temp }}/build" \
          OUTPUT_DIR="${{ runner.temp }}/output" \
          bash scripts/build-naga-wasm.sh

      - name: Build Naga (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          # For the aarch64-pc-windows-gnullvm cross-compile, point Cargo
          # at the LLVM-MinGW linker we just downloaded.  The variable name
          # is the Rust convention: CARGO_TARGET_<TRIPLE_UPPER>_LINKER.
          # Empty on amd64 builds — unset is fine; Cargo only reads the
          # var when building that specific target.
          CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER: ${{ github.workspace }}/llvm-mingw-20260311-ucrt-x86_64/bin/aarch64-w64-mingw32-clang
        run: |
          chmod +x scripts/build-naga.sh
          BUILD_DIR="${{ runner.temp }}/build" \
          OUTPUT_DIR="${{ runner.temp }}/output" \
          CROSS_COMPILE_TARGET="${{ matrix.cross_compile_target || '' }}" \
          bash scripts/build-naga.sh

      - name: Build Naga (macOS/Linux)
        if: runner.os != 'Windows' && !matrix.wasm
        shell: bash
        run: |
          chmod +x scripts/build-naga.sh
          BUILD_DIR="${{ runner.temp }}/build" \
          OUTPUT_DIR="${{ runner.temp }}/output" \
          MACOS_ARCH="${{ matrix.macos_arch || '' }}" \
          CMAKE_ARCH="${{ matrix.platform == 'linux-arm64' && 'aarch64' || matrix.cross || '' }}" \
          bash scripts/build-naga.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: naga-${{ matrix.platform }}
          path: ${{ runner.temp }}/output/naga-${{ matrix.platform }}.*

  download-wgpu-native:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [verify-licenses]
    name: Download wgpu-native (Prebuilt)
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-14
            wgpu_platform: macos-aarch64
          - platform: darwin-amd64
            os: macos-latest
            wgpu_platform: macos-x86_64
          - platform: linux-amd64
            os: ubuntu-latest
            wgpu_platform: linux-x86_64
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            wgpu_platform: linux-aarch64
          - platform: windows-amd64
            os: windows-latest
            wgpu_platform: windows-x86_64-msvc
          - platform: windows-arm64
            os: windows-latest
            wgpu_platform: windows-aarch64-msvc
          # gfx-rs publishes no riscv64 binary: built from the same tag with
          # Rust's riscv64gc target (scripts/build-wgpu-native.sh).
          - platform: linux-riscv64
            os: ubuntu-latest
            source: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (source build)
        if: matrix.source
        uses: dtolnay/rust-toolchain@stable

      - name: Install the riscv64 cross toolchain and libclang (source build)
        # The cross gcc links the cdylib; libclang serves wgpu-native's
        # bindgen, which runs on the builder over the target's headers.
        if: matrix.source
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-riscv64-linux-gnu libc6-dev-riscv64-cross libstdc++-13-dev-riscv64-cross binutils-riscv64-linux-gnu libclang-dev

      - name: Build wgpu-native from source
        if: matrix.source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The same release the download legs take: the latest, resolved
          # the same way (authenticated to avoid rate limits).
          LATEST_RELEASE=$(curl -sH "Authorization: token $GH_TOKEN" https://api.github.com/repos/gfx-rs/wgpu-native/releases/latest)
          VERSION=$(echo "$LATEST_RELEASE" | grep '"tag_name"' | sed -E 's/.*"tag_name": "([^"]+)".*/\1/')
          [ -n "$VERSION" ] || { echo "::error::could not determine the latest wgpu-native release"; exit 1; }
          echo "Building wgpu-native $VERSION for ${{ matrix.platform }}"
          chmod +x scripts/build-wgpu-native.sh
          BUILD_DIR="${{ runner.temp }}/build" \
          OUTPUT_DIR="$(pwd)/output" \
          WGPU_VERSION="$VERSION" \
          CMAKE_ARCH="riscv64" \
          bash scripts/build-wgpu-native.sh

      - name: Download wgpu-native
        if: ${{ !matrix.source }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Query GitHub for latest release (authenticated to avoid rate limits)
          echo "Querying GitHub for latest wgpu-native release..."
          LATEST_RELEASE=$(curl -sH "Authorization: token $GH_TOKEN" https://api.github.com/repos/gfx-rs/wgpu-native/releases/latest)
          VERSION=$(echo "$LATEST_RELEASE" | grep '"tag_name"' | sed -E 's/.*"tag_name": "([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "Warning: Could not determine latest version, using v27.0.4.0"
            VERSION="v27.0.4.0"
          fi
          echo "Latest version: $VERSION"

          # Download licenses first (fail fast)
          echo "Downloading licenses..."
          mkdir -p licenses
          curl -sL -o licenses/LICENSE.MIT \
            "https://raw.githubusercontent.com/gfx-rs/wgpu-native/trunk/LICENSE.MIT" || \
          curl -sL -o licenses/LICENSE.MIT \
            "https://raw.githubusercontent.com/gfx-rs/wgpu/trunk/LICENSE.MIT"
          curl -sL -o licenses/LICENSE.APACHE \
            "https://raw.githubusercontent.com/gfx-rs/wgpu-native/trunk/LICENSE.APACHE" || \
          curl -sL -o licenses/LICENSE.APACHE \
            "https://raw.githubusercontent.com/gfx-rs/wgpu/trunk/LICENSE.APACHE"

          if [ ! -s licenses/LICENSE.MIT ] || [ ! -s licenses/LICENSE.APACHE ]; then
            echo "Error: Failed to download license files"
            exit 1
          fi
          echo "Licenses verified"

          # Download prebuilt archive
          DOWNLOAD_URL="https://github.com/gfx-rs/wgpu-native/releases/download/${VERSION}/wgpu-${{ matrix.wgpu_platform }}-release.zip"
          echo "Downloading: $DOWNLOAD_URL"
          curl -sL -o wgpu.zip "$DOWNLOAD_URL"

          # Extract
          mkdir -p extract
          unzip -q wgpu.zip -d extract

          # Package
          PACKAGE_DIR="output/wgpu-${{ matrix.platform }}"
          mkdir -p "$PACKAGE_DIR/include/webgpu"
          mkdir -p "$PACKAGE_DIR/lib"

          # Copy headers
          cp extract/include/webgpu/webgpu.h "$PACKAGE_DIR/include/webgpu/"
          cp extract/include/webgpu/wgpu.h "$PACKAGE_DIR/include/webgpu/"

          # Copy libraries (grab everything in lib/)
          cp extract/lib/* "$PACKAGE_DIR/lib/" 2>/dev/null || true

          # Copy licenses
          cp licenses/LICENSE.MIT "$PACKAGE_DIR/"
          cp licenses/LICENSE.APACHE "$PACKAGE_DIR/"

          # Create archive
          cd output
          tar -czf "wgpu-${{ matrix.platform }}.tar.gz" "wgpu-${{ matrix.platform }}"
          echo "Created: wgpu-${{ matrix.platform }}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wgpu-${{ matrix.platform }}
          path: output/wgpu-${{ matrix.platform }}.tar.gz

  determine-version:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    name: Determine Version
    needs: [build-glslang, build-spirv-cross, build-mesa-spirv-to-dxil, build-llvm, build-clspv, build-spirv-llvm-translator, build-naga, build-libfido2, download-wgpu-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Need write permission to create and push tags
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to find all tags

      - name: Calculate version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger - calculate next version from latest tag
            # Get all tags matching vX.Y.Z format (excluding go/fetch/gpu tags like go/fetch/gpu/v1.0.0)
            LATEST_TAG=$(git tag | grep '^v[0-9]\+\.[0-9]\+\.[0-9]\+$' | sort -V | tail -1)
            if [ -z "$LATEST_TAG" ]; then
              # No tags yet - start at v0.0.45 (continuing from where we left off)
              LATEST_TAG="v0.0.44"
            fi
            echo "Latest tag: $LATEST_TAG"

            # Extract version numbers (expecting vX.Y.Z format)
            if [[ $LATEST_TAG =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"

              # Increment patch version
              NEXT_PATCH=$((PATCH + 1))
              VERSION="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
            else
              # Fallback if tag format is unexpected
              VERSION="v0.0.45"
            fi

            echo "Next version: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT

            # Create and push the tag (both for main release and go/fetch/gpu module)
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # Create main release tag (vX.Y.Z)
            git tag $VERSION
            git push origin $VERSION
          else
            # Tag push - use the tag name
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

  create-release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    name: Create External Binaries Release
    needs: [determine-version, determine-shas]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download external binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          # clang-* is the slim toolchain asset; it does not collide with
          # clspv-* (the pattern is matched against whole artifact names).
          pattern: '{glslang,spirv-cross,spirv-to-dxil,naga,wgpu,llvm,clang,clspv,spirv-llvm-translator,libfido2}-*'

      - name: Display artifact structure
        run: ls -R artifacts

      # Everything that can make the release short is checked BEFORE the
      # release record exists. Until now a 2 GiB overflow surfaced only as
      # a failed upload in the loop below, after `gh release create`, which
      # left a half-populated tag that e's fetch could resolve as "latest".
      - name: Verify assets before the release exists
        env:
          LLVM_SHA: ${{ needs.determine-shas.outputs.llvm_sha }}
          # CLANG_ASSET_MAX_BYTES, the slim clang's cap, is the workflow-level
          # env - the one literal the build legs packaged under, so this
          # check cannot disagree with theirs; the per-platform report in
          # the step summary says what each asset really weighs.
        run: |
          set -eo pipefail
          shopt -s globstar nullglob
          # An unset cap would make the -gt below a bash error inside an if,
          # i.e. a check that silently passes; refuse to run without it.
          : "${CLANG_ASSET_MAX_BYTES:?is unset - the workflow-level env at the top of this file sets it}"
          GITHUB_ASSET_CAP=2147483648   # GitHub's per-asset limit: 2 GiB
          FAILED=0

          for f in artifacts/**/*.tar.gz artifacts/**/*.zip; do
            size=$(wc -c < "$f")
            if [ "$size" -ge "$GITHUB_ASSET_CAP" ]; then
              echo "::error::$(basename "$f") is $size bytes — at or over GitHub's 2 GiB asset cap; it would fail to upload"
              FAILED=1
            fi
          done

          {
            echo "## Slim clang assets"
            echo
            echo "| asset | bytes | MiB |"
            echo "|---|---:|---:|"
          } >> "$GITHUB_STEP_SUMMARY"
          n=0
          for f in artifacts/**/clang-*.tar.gz; do
            n=$((n + 1))
            base=$(basename "$f" .tar.gz)          # clang-<platform>
            size=$(wc -c < "$f")
            echo "| $base.tar.gz | $size | $((size / 1048576)) |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$size" -gt "$CLANG_ASSET_MAX_BYTES" ]; then
              echo "::error::$base.tar.gz is $size bytes, over the slim cap of $CLANG_ASSET_MAX_BYTES"
              FAILED=1
            fi
            case "$base" in *windows*) exe=.exe ;; *) exe= ;; esac
            list=$(tar -tzf "$f")
            for need in "$base/VERSION" "$base/bin/clang$exe" "$base/bin/lld$exe" "$base/bin/llvm-objdump$exe" \
                        "$base/LICENSES/LLVM-LICENSE.TXT" "$base/LICENSES/Clang-LICENSE.TXT" "$base/LICENSES/LLD-LICENSE.TXT"; do
              if ! echo "$list" | grep -qx "$need"; then
                echo "::error::$base.tar.gz lacks $need"
                FAILED=1
              fi
            done
            if ! echo "$list" | grep -qE "^$base/lib/clang/[0-9]+/include/stdint\.h$"; then
              echo "::error::$base.tar.gz lacks lib/clang/<ver>/include/stdint.h (the builtin headers)"
              FAILED=1
            fi
            v=$(tar -xzOf "$f" "$base/VERSION" | tr -d '\r\n ')
            if [ "$v" != "$LLVM_SHA" ]; then
              echo "::error::$base.tar.gz VERSION is '$v' but this release pins LLVM $LLVM_SHA"
              FAILED=1
            fi
          done
          # One per native platform (build-llvm's matrix minus wasm).
          if [ "$n" -ne 7 ]; then
            echo "::error::expected 7 clang-<platform>.tar.gz assets, found $n"
            FAILED=1
          fi
          for r in artifacts/**/clang-*.report.txt; do
            {
              echo
              echo "<details><summary>$(basename "$r")</summary>"
              echo
              echo '```'
              cat "$r"
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::asset verification failed — no release was created"
            exit 1
          fi
          echo "All assets verified."

      - name: Create redistributables Release
        # softprops/action-gh-release@v1 uploads all release assets
        # concurrently. Our release is ~9GB across 64 assets (eight
        # LLVM artifacts alone are 1–1.9GB each; the seven clang-* slim
        # assets are small). Parallel Node.js
        # uploads of that payload reliably OOM the runner — the Actions
        # infra sends a "runner has received a shutdown signal" ~30s
        # into the upload burst. Switching to the gh CLI and uploading
        # one asset at a time keeps memory bounded and is resumable
        # via --clobber across workflow re-runs.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.determine-version.outputs.version }}
          GPU_VERSION: ${{ needs.determine-version.outputs.gpu_version }}
        run: |
          set -eo pipefail
          shopt -s globstar nullglob

          # Render release notes from the template. Using sed substitution
          # rather than heredoc expansion keeps the template file usable
          # as-is for local inspection and doesn't require escaping every
          # backtick/dollar-sign in the markdown body.
          sed \
            -e "s|__VERSION__|${VERSION}|g" \
            -e "s|__GPU_VERSION__|${GPU_VERSION}|g" \
            .github/release-notes.template.md > /tmp/release-body.md

          # Create the release (idempotent — if a prior attempt of this
          # workflow created it, we just update the notes and reuse the
          # existing tag/release record).
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — updating notes, re-uploading assets with --clobber"
            gh release edit "$VERSION" --notes-file /tmp/release-body.md
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file /tmp/release-body.md
          fi

          # Serial upload loop. --clobber overwrites any asset from a
          # prior attempt. Single retry on transient GitHub API errors.
          COUNT=0
          FAILED=0
          for f in artifacts/**/*.tar.gz artifacts/**/*.zip; do
            COUNT=$((COUNT + 1))
            SIZE=$(du -h "$f" | cut -f1)
            echo "[$COUNT] ⬆️  $(basename "$f") ($SIZE)"
            if ! gh release upload "$VERSION" "$f" --clobber; then
              echo "  ⚠️  upload failed; sleeping 10s and retrying once..."
              sleep 10
              if ! gh release upload "$VERSION" "$f" --clobber; then
                echo "  ❌ retry failed for $f"
                FAILED=$((FAILED + 1))
              fi
            fi
          done

          echo "Uploaded $((COUNT - FAILED))/$COUNT assets to $VERSION"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED asset(s) failed to upload after retry"
            exit 1
          fi

  # ================================================================
  #  Notify on failure — opens (or updates) a "build-failing" issue.
  #
  #  Because the scheduled check-versions workflow dispatches this one
  #  via GITHUB_TOKEN, failure emails go to github-actions[bot], not the
  #  repo owner.  An issue is a routing-independent signal: the owner's
  #  "All" notification preference picks it up.
  #
  #  check-versions.yml gates its auto-dispatch on this issue being
  #  open, so a failing build halts daily auto-dispatch until the
  #  issue is closed.  Manual workflow_dispatch is always allowed.
  # ================================================================
  notify-failure:
    name: Open or update build-failing issue
    if: failure() && startsWith(github.ref, 'refs/tags/')
    needs:
      - announce
      - determine-shas
      - verify-licenses
      - build-glslang
      - build-spirv-cross
      - build-mesa-spirv-to-dxil
      - build-llvm
      - build-clspv
      - build-spirv-llvm-translator
      - build-naga
      - download-wgpu-native
      - determine-version
      - create-release
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const eventName = context.eventName;
            const triggerReason = `${{ inputs.trigger_reason || 'unknown' }}`;

            const body = [
              `Build failed: [run #${context.runId}](${runUrl})`,
              ``,
              `**Trigger:** ${eventName} — ${triggerReason}`,
              `**Commit:** ${context.sha}`,
              ``,
              `Auto-dispatch from check-versions is paused until this issue is closed.`,
              `Manual \`workflow_dispatch\` from the Actions tab is still allowed for testing fixes.`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'build-failing',
              per_page: 1,
            });

            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: body,
              });
              core.notice(`Commented on existing build-failing issue #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Build failing — manual intervention required',
                body: body,
                labels: ['build-failing'],
              });
              core.notice(`Opened build-failing issue #${created.data.number}`);
            }
