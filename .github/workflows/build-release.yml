name: Build and Release Redistributables

on:
  push:
    tags:
      - 'v*'
    # A push to main that touches the LLVM build warms the build-llvm caches:
    # GitHub scopes a cache to the ref that made it, so a tag run never sees
    # another tag run's dev kits, and every tag build was cold (v0.0.83-86:
    # 1-3 h per leg). Caches made on the default branch are readable by every
    # ref, so this run builds and caches the eight LLVM legs and nothing else -
    # every other job is gated on a tag below - and the next tag run restores
    # them and repackages the slim clang in minutes.
    branches:
      - main
    paths:
      - scripts/build-llvm.sh
      - scripts/common.sh
      - scripts/package-clang.sh
      - scripts/package-clang-from-devkit.sh
      - CURRENT_VERSIONS.txt
      - .github/workflows/build-release.yml
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: "Why this build was triggered (auto-filled by version check)"
        required: false
        default: "Alpha and Omega"
        type: string

env:
  # Every step may ask GitHub's API for a tool's latest release (the build
  # scripts and the wasm steps do): authenticated, so a shared runner IP's
  # rate limit cannot decide a leg - v0.0.88's SPIRV-Cross wasm leg fell to a 403.
  GH_TOKEN: ${{ github.token }}
  # The slim clang asset's size cap in bytes: 160 MiB. package-clang.sh's
  # own default is 104857600 (100 MiB, the gameplan's figure); this is the
  # measured reality - v0.0.85's linux-amd64 asset weighed 125,933,623 B
  # (120.1 MiB) and linux-arm64's 122,270,824 B (116.6 MiB), because an ELF
  # with a static libstdc++ and no section GC is ~40% bigger than the
  # Mach-O and PE builds (darwin-arm64 87,057,453 B = 83.0 MiB,
  # windows-arm64 87,707,818 B = 83.6 MiB). One literal, read by every
  # place that applies the cap: build-llvm's "Build LLVM" steps (through
  # build-llvm.sh → package-clang.sh), its cache-hit "Package slim clang
  # from the cached dev kit" steps, and create-release's verification -
  # so the build-time and release-time checks can never disagree (one
  # inherited env rather than a literal repeated at each site, which
  # could drift; create-release refuses to run without it). It is
  # set here and not in the script because build-llvm's cache key hashes
  # scripts/build-llvm.sh, common.sh and package-clang.sh: a byte changed
  # in any of them throws away every hour-long dev kit the key still
  # matches.
  CLANG_ASSET_MAX_BYTES: "167772160"

jobs:
  announce:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    name: Trigger Info
    runs-on: ubuntu-latest
    steps:
      - name: Display trigger reason
        run: |
          echo "## Build Trigger" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REASON="${{ inputs.trigger_reason }}"
            if [ -z "$REASON" ] || [ "$REASON" = "Manual dispatch" ]; then
              echo "**Triggered by:** Manual dispatch" >> $GITHUB_STEP_SUMMARY
            else
              echo "**Triggered by:** $REASON" >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "**Triggered by:** Tag push (${{ github.ref_name }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          fi

  # ================================================================
  #  Resolve the three upstream commits we'll build against in ONE
  #  atomic step.  Doing this together (rather than per-build) eliminates
  #  a real race: if our LLVM SHA came from a DIFFERENT clspv tree than
  #  the one we later build, we'd ship LLVM that doesn't match the clspv
  #  we shipped.
  #
  #  Resolution order:
  #    1. clspv: the CLSPV_SHA pin in CURRENT_VERSIONS.txt (the ONE place
  #       the LLVM family is pinned; the file says why it is held)
  #    2. LLVM: the commit clspv's deps.json names AT that pin — and it
  #       must equal the file's LLVM_SHA, so a half-edited bump fails
  #       here, before any of the multi-hour builds starts. LLVM_SHA is
  #       what every e.json and generated kernel header downstream names
  #       (enigmatic's `e fetch clang` installs the clang-<platform>
  #       asset built from it).
  #    3. SPIRV-LLVM-Translator main HEAD — its main tracks LLVM main
  #       like clspv's pin does, so it co-evolves. The only floating
  #       input of the LLVM family.
  #
  #  All three SHAs feed cache keys for their respective builds, so any
  #  movement automatically invalidates the cache.
  # ================================================================
  determine-shas:
    name: Resolve upstream commits
    runs-on: ubuntu-latest
    outputs:
      llvm_sha: ${{ steps.resolve.outputs.llvm_sha }}
      clspv_sha: ${{ steps.resolve.outputs.clspv_sha }}
      translator_sha: ${{ steps.resolve.outputs.translator_sha }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          set -e

          CLSPV_SHA=$(sed -n 's/^CLSPV_SHA=//p' CURRENT_VERSIONS.txt | tr -d '\r ')
          PINNED_LLVM_SHA=$(sed -n 's/^LLVM_SHA=//p' CURRENT_VERSIONS.txt | tr -d '\r ')
          if [ -z "$CLSPV_SHA" ] || [ -z "$PINNED_LLVM_SHA" ]; then
            echo "::error::CURRENT_VERSIONS.txt must carry CLSPV_SHA= and LLVM_SHA= (the hand-maintained pins)"
            exit 1
          fi

          # Read deps.json AT the pinned clspv SHA — keeps LLVM matched
          # to the clspv tree we're actually building.
          LLVM_SHA=$(curl -sSLf "https://raw.githubusercontent.com/google/clspv/$CLSPV_SHA/deps.json" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(c["commit"] for c in d["commits"] if c["name"]=="llvm"))')

          if [ "$LLVM_SHA" != "$PINNED_LLVM_SHA" ]; then
            echo "::error::CURRENT_VERSIONS.txt says LLVM_SHA=$PINNED_LLVM_SHA but clspv $CLSPV_SHA pins LLVM $LLVM_SHA — edit the file so the two agree (both lines move together on a bump)"
            exit 1
          fi

          # The translator is pinned beside LLVM: its main commit of the same day as
          # LLVM_SHA (it tracks LLVM main in lockstep), hand-maintained in
          # CURRENT_VERSIONS.txt and moved together with LLVM_SHA. A floating main
          # HEAD demanded LLVM 24.0.0 against the 23.0.0git pin and killed v0.0.86.
          TRANSLATOR_SHA=$(sed -n 's/^TRANSLATOR_SHA=//p' CURRENT_VERSIONS.txt | tr -d '\r ')
          if [ -z "$TRANSLATOR_SHA" ]; then
            echo "::error::CURRENT_VERSIONS.txt must carry TRANSLATOR_SHA= (the translator commit contemporary with LLVM_SHA)"
            exit 1
          fi

          for var in CLSPV_SHA LLVM_SHA TRANSLATOR_SHA; do
            eval "val=\$$var"
            if [ -z "$val" ]; then
              echo "::error::Could not resolve $var"
              exit 1
            fi
            echo "$var=$val"
          done

          {
            echo "clspv_sha=$CLSPV_SHA"
            echo "llvm_sha=$LLVM_SHA"
            echo "translator_sha=$TRANSLATOR_SHA"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Pinned upstream commits"
            echo "- clspv: \`$CLSPV_SHA\` (CURRENT_VERSIONS.txt)"
            echo "- LLVM: \`$LLVM_SHA\` (from clspv deps.json @ pinned commit; equals CURRENT_VERSIONS.txt LLVM_SHA)"
            echo "- SPIRV-LLVM-Translator: \`$TRANSLATOR_SHA\` (CURRENT_VERSIONS.txt; contemporary with LLVM_SHA)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ================================================================
  #  Verify upstream licenses haven't changed before building.
  #  If any license hash doesn't match, the entire release is blocked.
  # ================================================================
  verify-licenses:
    needs: [determine-shas]
    name: Verify Licenses
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Check for open license issue
        id: existing
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'license-change'
            });
            if (issues.data.length > 0) {
              core.setOutput('blocked', 'true');
              core.setOutput('issue_url', issues.data[0].html_url);
              core.info(`Blocked by open license issue: ${issues.data[0].html_url}`);
            } else {
              core.setOutput('blocked', 'false');
            }

      - name: Block if unresolved license issue exists
        if: steps.existing.outputs.blocked == 'true'
        run: |
          echo "::error::Release blocked by unresolved license issue: ${{ steps.existing.outputs.issue_url }}"
          echo "Close the issue after reviewing the license changes and updating the expected hashes."
          exit 1

      - name: Clone and verify upstream licenses
        run: |
          set -e
          mkdir -p /tmp/license-check && cd /tmp/license-check

          echo "Cloning upstream repositories..."
          # The licenses verified are the licenses that SHIP: every clone is
          # at the version the build uses, never a default branch. glslang,
          # SPIRV-Cross, wgpu-native and wgpu (Naga) are the tags
          # CURRENT_VERSIONS.txt names; SPIRV-Tools and SPIRV-Headers are the
          # commits glslang's known_good.json pins for that glslang, exactly
          # as build-glslang.sh checks them out. (v0.0.83's build failed here
          # on wgpu's trunk, whose LICENSE.MIT had moved to a 2026 copyright
          # line while the v30.0.1 that builds still carried 2025.)
          V="$GITHUB_WORKSPACE/CURRENT_VERSIONS.txt"
          pin() { sed -n "s/^$1=//p" "$V" | tr -d '\r '; }
          GLSLANG_VERSION=$(pin GLSLANG); SPIRV_CROSS_VERSION=$(pin SPIRV_CROSS)
          WGPU_VERSION=$(pin WGPU); NAGA_VERSION=$(pin NAGA)
          for v in GLSLANG_VERSION SPIRV_CROSS_VERSION WGPU_VERSION NAGA_VERSION; do
            if [ -z "${!v}" ]; then echo "::error::CURRENT_VERSIONS.txt has no line for ${v%_VERSION}"; exit 1; fi
          done
          echo "glslang $GLSLANG_VERSION · SPIRV-Cross $SPIRV_CROSS_VERSION · wgpu-native $WGPU_VERSION · wgpu (Naga) $NAGA_VERSION"
          git clone --depth 1 --branch "$GLSLANG_VERSION" https://github.com/KhronosGroup/glslang.git
          SPIRV_TOOLS_SHA=$(python3 -c "import json; d=json.load(open('glslang/known_good.json')); print(next(c['commit'] for c in d['commits'] if c['name']=='spirv-tools'))")
          SPIRV_HEADERS_SHA=$(python3 -c "import json; d=json.load(open('glslang/known_good.json')); print(next(c['commit'] for c in d['commits'] if c['name']=='spirv-tools/external/spirv-headers'))")
          echo "SPIRV-Tools $SPIRV_TOOLS_SHA · SPIRV-Headers $SPIRV_HEADERS_SHA (glslang's known_good.json)"
          git clone https://github.com/KhronosGroup/SPIRV-Tools.git spirv-tools
          (cd spirv-tools && git checkout -q "$SPIRV_TOOLS_SHA")
          git clone https://github.com/KhronosGroup/SPIRV-Headers.git spirv-headers
          (cd spirv-headers && git checkout -q "$SPIRV_HEADERS_SHA")
          git clone --depth 1 --branch "$SPIRV_CROSS_VERSION" https://github.com/KhronosGroup/SPIRV-Cross.git spirv-cross
          git clone --depth 1 --branch "$WGPU_VERSION" https://github.com/gfx-rs/wgpu-native.git wgpu-native
          git clone --depth 1 --branch "$NAGA_VERSION" https://github.com/gfx-rs/wgpu.git wgpu
          # FIDO2 stack: pin to the exact release tags build-libfido2.sh
          # consumes so a licence amendment in a future tag doesn't
          # slip past the check.
          git clone --depth 1 --branch 1.15.0 https://github.com/Yubico/libfido2.git libfido2
          git clone --depth 1 --branch v0.11.0 https://github.com/PJK/libcbor.git libcbor
          git clone --depth 1 --branch hidapi-0.14.0 https://github.com/libusb/hidapi.git hidapi
          # OpenSSL: bundled inside every Windows libfido2 tarball
          # (source-built with MinGW so libmental gets GNU-format .a).
          # macOS/Linux use the host's OpenSSL, but the LICENSE we ship
          # comes from the pinned source tree, so verify against the same
          # release tag.
          git clone --depth 1 --branch openssl-3.6.3 https://github.com/openssl/openssl.git openssl
          # Mesa: only the spirv-to-dxil carve-out lands in our packages,
          # but the umbrella license text is what consumers reference.
          # Pin to the same release tag the build script uses so a Mesa
          # release with a license amendment is caught BEFORE the build.
          git clone --depth 1 --branch mesa-26.0.6 https://gitlab.freedesktop.org/mesa/mesa.git mesa

          # clspv, SPIRV-LLVM-Translator, LLVM: pinned to the EXACT commits
          # determine-shas resolved.  We can't use `git clone --branch <sha>`
          # for arbitrary SHAs — codeload tarball endpoint instead, which
          # also matches what the build scripts will pull.  This guarantees
          # the licenses we verified are the licenses we actually shipped.
          CLSPV_SHA="${{ needs.determine-shas.outputs.clspv_sha }}"
          TRANSLATOR_SHA="${{ needs.determine-shas.outputs.translator_sha }}"
          LLVM_SHA="${{ needs.determine-shas.outputs.llvm_sha }}"

          echo "clspv license check target: $CLSPV_SHA"
          curl -sSLf "https://codeload.github.com/google/clspv/tar.gz/$CLSPV_SHA" | tar -xz
          mv "clspv-$CLSPV_SHA" clspv

          echo "SPIRV-LLVM-Translator license check target: $TRANSLATOR_SHA"
          curl -sSLf "https://codeload.github.com/KhronosGroup/SPIRV-LLVM-Translator/tar.gz/$TRANSLATOR_SHA" | tar -xz
          mv "SPIRV-LLVM-Translator-$TRANSLATOR_SHA" spirv-llvm-translator

          echo "LLVM license check target: $LLVM_SHA"
          curl -sSLf "https://codeload.github.com/llvm/llvm-project/tar.gz/$LLVM_SHA" | tar -xz
          mv "llvm-project-$LLVM_SHA" llvm-project

          # Expected hashes — update when licenses are reviewed and approved
          EXPECTED_GLSLANG="17e70c676e1521ff3e4686f04a2053d93a7e28a33be8de7ec37ab0ff72feb677"
          EXPECTED_SPIRV_TOOLS="cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30"
          EXPECTED_SPIRV_HEADERS="ea43b1de38a6f90c488800d66dec1ed671e68cda530266bc96951fb5b6307613"
          EXPECTED_SPIRV_CROSS="cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30"
          EXPECTED_WGPU_MIT="c7fea58d1cfe49634cd92e54fc10a9d871f4b275321a4cd8c09e449122caaeb4"
          EXPECTED_WGPU_APACHE="a6cba85bc92e0cff7a450b1d873c0eaa2e9fc96bf472df0247a26bec77bf3ff9"
          EXPECTED_NAGA_MIT="dc0d97139e8205818c703741c7be7cb3b96888bd5917b8d6fc6133731e403c21"
          EXPECTED_NAGA_APACHE="a6cba85bc92e0cff7a450b1d873c0eaa2e9fc96bf472df0247a26bec77bf3ff9"
          EXPECTED_CLSPV="2050d82ea19614989deac39163c471b6e753659dfd4e4e88c6f724624db59f32"
          EXPECTED_LLVM="8d85c1057d742e597985c7d4e6320b015a9139385cff4cbae06ffc0ebe89afee"
          EXPECTED_CLANG="ebcd9bbf783a73d05c53ba4d586b8d5813dcdf3bbec50265860ccc885e606f47"
          # lld joined the native LLVM build (its archives ship in the dev
          # kit, its driver in the slim clang asset); its LICENSE.TXT is the
          # same Apache-2.0 WITH LLVM-exception text with its own legacy
          # copyright line, hence its own hash.
          EXPECTED_LLD="f7891568956e34643eb6a0db1462db30820d40d7266e2a78063f2fe233ece5a0"
          EXPECTED_SPIRV_TRANSLATOR="e3bc36440fc927c62d5cc24efeefe225a14d4e34ffeb0c92e430625cce9ee444"
          EXPECTED_MESA="0d1a0472ecc81830e75c20d59b0ea02841e3db21255e0ebad97ab682c54d6615"
          EXPECTED_LIBFIDO2="e8946152897134a9e9205b0db0659dd77c279de683d7cc64465629a12d1abfd8"
          EXPECTED_LIBCBOR="6a5e182d758db66ecad6e6fa304dc637d4d2585bafceb5003c86e8dc9f6344ff"
          EXPECTED_HIDAPI="7d3b087c34f35d4d538e3bcddd1ff8f66e92f9ef336881999482800ddf840913"
          EXPECTED_OPENSSL="7d5450cb2d142651b8afa315b5f238efc805dad827d91ba367d8516bc9d49e7a"

          FAILED=0
          CHANGES=""

          check() {
            local name="$1" file="$2" expected="$3"
            actual=$(sha256sum "$file" | awk '{print $1}')
            if [ "$actual" != "$expected" ]; then
              echo "::error::$name license has CHANGED (expected $expected, got $actual)"
              CHANGES="${CHANGES}- **${name}**: hash changed from \`${expected}\` to \`${actual}\`\n"
              FAILED=1
            else
              echo "✅ $name license verified"
            fi
          }

          check "glslang" glslang/LICENSE.txt "$EXPECTED_GLSLANG"
          check "SPIRV-Tools" spirv-tools/LICENSE "$EXPECTED_SPIRV_TOOLS"
          check "SPIRV-Headers" spirv-headers/LICENSE "$EXPECTED_SPIRV_HEADERS"
          check "SPIRV-Cross" spirv-cross/LICENSE "$EXPECTED_SPIRV_CROSS"
          check "wgpu-native MIT" wgpu-native/LICENSE.MIT "$EXPECTED_WGPU_MIT"
          check "wgpu-native Apache" wgpu-native/LICENSE.APACHE "$EXPECTED_WGPU_APACHE"
          check "Naga/wgpu MIT" wgpu/LICENSE.MIT "$EXPECTED_NAGA_MIT"
          check "Naga/wgpu Apache" wgpu/LICENSE.APACHE "$EXPECTED_NAGA_APACHE"
          check "clspv" clspv/LICENSE "$EXPECTED_CLSPV"
          check "LLVM" llvm-project/llvm/LICENSE.TXT "$EXPECTED_LLVM"
          check "Clang" llvm-project/clang/LICENSE.TXT "$EXPECTED_CLANG"
          check "LLD" llvm-project/lld/LICENSE.TXT "$EXPECTED_LLD"
          check "SPIRV-LLVM-Translator" spirv-llvm-translator/LICENSE.TXT "$EXPECTED_SPIRV_TRANSLATOR"
          check "Mesa (spirv-to-dxil)" mesa/docs/license.rst "$EXPECTED_MESA"
          check "libfido2" libfido2/LICENSE "$EXPECTED_LIBFIDO2"
          check "libcbor" libcbor/LICENSE.md "$EXPECTED_LIBCBOR"
          check "hidapi" hidapi/LICENSE.txt "$EXPECTED_HIDAPI"
          check "OpenSSL" openssl/LICENSE.txt "$EXPECTED_OPENSSL"

          echo "CHANGES<<EOF" >> $GITHUB_ENV
          echo -e "$CHANGES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          if [ $FAILED -eq 1 ]; then
            echo "LICENSE_FAILED=true" >> $GITHUB_ENV
            exit 1
          fi

          echo ""
          echo "All upstream licenses verified — proceeding with build."

      - name: Create license issue
        if: failure() && env.LICENSE_FAILED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // Only create if no open issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'license-change'
            });

            if (issues.data.length > 0) {
              core.info('License issue already exists, skipping creation');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Upstream License Change Detected — Releases Blocked',
              body: `An upstream license has changed. All releases are **blocked** until this issue is resolved and closed.

            ## Changes Detected

            ${process.env.CHANGES}

            ## Required Actions

            1. Review the new license text for each changed dependency
            2. Verify the license is still permissive and compatible
            3. Update the expected hashes in \`build-release.yml\` → \`verify-licenses\` job
            4. Close this issue — releases will resume automatically

            ## Workflow Run

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ---
            🤖 This issue was automatically created by the release pipeline.
            **All releases are blocked while this issue is open.**`,
              labels: ['license-change', 'automated']
            });

  build-glslang:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [verify-licenses]
    name: "Build glslang (${{ matrix.platform }})"
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            runner: macos-14  # ARM64
            platform: darwin-arm64
            macos_arch: arm64
          - os: macos-latest
            runner: macos-14  # Cross-compile x86_64 on ARM64
            platform: darwin-amd64
            macos_arch: x86_64
          - os: ubuntu-latest
            runner: ubuntu-latest
            platform: linux-amd64
          - os: ubuntu-latest
            runner: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-latest
            runner: windows-latest
            platform: windows-amd64
            mingw_arch: x86_64
          - os: windows-latest
            runner: windows-latest
            platform: windows-arm64
            mingw_arch: x86_64
            cross_compile_target: aarch64
          - os: ubuntu-latest
            runner: ubuntu-latest
            platform: linux-riscv64
            cross: riscv64
          - os: ubuntu-latest
            runner: ubuntu-latest
            platform: wasm
            wasm: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MinGW (Windows)
        if: matrix.mingw_arch
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          cache: true
          install: >-
            mingw-w64-${{ matrix.mingw_arch }}-gcc
            mingw-w64-${{ matrix.mingw_arch }}-cmake
            mingw-w64-${{ matrix.mingw_arch }}-ninja
            mingw-w64-${{ matrix.mingw_arch }}-python
            mingw-w64-${{ matrix.mingw_arch }}-clang
            mingw-w64-${{ matrix.mingw_arch }}-lld
            git
            make

      - name: Cache llvm-mingw
        if: matrix.cross_compile_target == 'aarch64'
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: llvm-mingw-20260311-ucrt-x86_64
          key: llvm-mingw-20260311-ucrt-x86_64

      - name: Download ARM64 MinGW runtime libraries
        if: matrix.cross_compile_target == 'aarch64' && steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Download llvm-mingw which has ARM64 runtime libraries
          curl -L -o llvm-mingw.zip https://github.com/mstorsjo/llvm-mingw/releases/download/20260311/llvm-mingw-20260311-ucrt-x86_64.zip
          unzip -q llvm-mingw.zip

      - name: Setup ARM64 libraries
        if: matrix.cross_compile_target == 'aarch64'
        shell: bash
        run: |
          # Copy ARM64 libraries to a location where the linker can find them (use Windows path)
          mkdir -p D:/a/_temp/msys64/mingw64/aarch64-w64-mingw32
          cp -r llvm-mingw-20260311-ucrt-x86_64/aarch64-w64-mingw32/* D:/a/_temp/msys64/mingw64/aarch64-w64-mingw32/

      - name: Install Emscripten (WASM)
        if: matrix.wasm
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "5.0.1"

      - name: Build glslang (Windows)
        if: matrix.mingw_arch
        shell: msys2 {0}
        run: |
          echo "DEBUG: Checking for clang..."
          which clang || echo "clang not found"
          which clang.exe || echo "clang.exe not found"
          ls -la /mingw64/bin/clang* || echo "No clang binaries found"
          echo "DEBUG: PATH=$PATH"
          BUILD_DIR="${{ runner.temp }}/build" \
          OUTPUT_DIR="${{ runner.temp }}/output" \
          USE_MINGW=1 \
          CROSS_COMPILE_TARGET="${{ matrix.cross_compile_target || '' }}" \
          bash scripts/build-glslang.sh

      - name: Install the riscv64 cross toolchain (linux-riscv64)
        # The one cross leg among the native platforms: GitHub hosts no
        # riscv64 runner, so ubuntu-latest builds with Ubuntu's own cross
        # toolchain, and the build script takes CMAKE_ARCH=riscv64.
        if: matrix.cross == 'riscv64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-riscv64-linux-gnu libc6-dev-riscv64-cross libstdc++-13-dev-riscv64-cross binutils-riscv64-linux-gnu
          riscv64-linux-gnu-g++ --version | head -1

      - name: Build glslang (macOS/Linux)
        if: ${{ !matrix.mingw_arch && !matrix.wasm }}
        shell: bash
        run: |
          chmod +x scripts/build-glslang.sh
          BUILD_DIR="${{ runner.temp }}/build" \
          OUTPUT_DIR="${{ runner.temp }}/output" \
          MACOS_ARCH="${{ matrix.macos_arch || '' }}" \
          CMAKE_ARCH="${{ matrix.cross || '' }}" \
          bash scripts/build-glslang.sh

      - name: Build glslang (WASM)
        if: matrix.wasm
        shell: bash
        run: |
          GLSLANG_VERSION=$(curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/KhronosGroup/glslang/releases/latest | grep '"tag_name"' | sed -E 's/.*"tag_name": "([^"]+)".*/\1/')
          echo "Building glslang $GLSLANG_VERSION for WASM..."

          mkdir -p wasm-build && cd wasm-build

          git clone --depth 1 --branch "$GLSLANG_VERSION" https://github.com/KhronosGroup/glslang.git

          # Pin SPIRV-Tools + SPIRV-Headers to the SHAs glslang lists
          # in its own known_good.json instead of tracking `main`.
          # Tracking main broke recently when SPIRV-Tools added
          # SPV_OPERAND_TYPE_GATHER_MODES and glslang 16.3.0's generated
          # core_tables_body.inc failed to compile.  Same fix build-glslang.sh
          # applies for the native builds.
          if [ -f glslang/known_good.json ]; then
            SPIRV_TOOLS_SHA=$(python3 -c "import json; d=json.load(open('glslang/known_good.json')); print(next(c['commit'] for c in d['commits'] if c['name']=='spirv-tools'))")
            SPIRV_HEADERS_SHA=$(python3 -c "import json; d=json.load(open('glslang/known_good.json')); print(next(c['commit'] for c in d['commits'] if c['name']=='spirv-tools/external/spirv-headers'))")
            echo "SPIRV-Tools SHA:   $SPIRV_TOOLS_SHA"
            echo "SPIRV-Headers SHA: $SPIRV_HEADERS_SHA"
            git clone https://github.com/KhronosGroup/SPIRV-Tools.git spirv-tools
            (cd spirv-tools && git checkout "$SPIRV_TOOLS_SHA")
            git clone https://github.com/KhronosGroup/SPIRV-Headers.git spirv-tools/external/spirv-headers
            (cd spirv-tools/external/spirv-headers && git checkout "$SPIRV_HEADERS_SHA")
          else
            echo "WARNING: glslang/known_good.json missing; falling back to main"
            git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Tools.git spirv-tools
            git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git spirv-tools/external/spirv-headers
          fi
          mkdir -p glslang/External
          ln -sf ../../spirv-tools glslang/External/spirv-tools

          cd glslang && mkdir -p build && cd build

          emcmake cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_SPVREMAPPER=OFF \
            -DENABLE_GLSLANG_BINARIES=OFF \
            -DENABLE_CTEST=OFF \
            -DENABLE_OPT=ON \
            -DGLSLANG_TESTS=OFF

          emmake cmake --build . --config Release -j$(nproc)

          # Package
          PACKAGE_DIR="${{ runner.temp }}/output/glslang-wasm"
          mkdir -p "$PACKAGE_DIR"
          find . -name "*.a" -exec cp {} "$PACKAGE_DIR/" \;

          # Copy headers
          cd "${{ github.workspace }}/wasm-build/glslang"
          find . -name "*.h" -o -name "*.hpp" | while read header; do
            mkdir -p "$PACKAGE_DIR/$(dirname "$header")"
            cp "$header" "$PACKAGE_DIR/$header"
          done

          # Copy glslang build_info.h
          if [ -f "build/include/glslang/build_info.h" ]; then
            mkdir -p "$PACKAGE_DIR/build/include/glslang"
            cp "build/include/glslang/build_info.h" "$PACKAGE_DIR/build/include/glslang/"
          fi

          # Licenses
          cp "LICENSE.txt" "$PACKAGE_DIR/LICENSE.txt"
          mkdir -p "$PACKAGE_DIR/LICENSES"
          cp "External/spirv-tools/LICENSE" "$PACKAGE_DIR/LICENSES/SPIRV-Tools-LICENSE"
          cp "External/spirv-tools/external/spirv-headers/LICENSE" "$PACKAGE_DIR/LICENSES/SPIRV-Headers-LICENSE"

          cd "${{ runner.temp }}/output"
          tar -czf "glslang-wasm.tar.gz" "glslang-wasm"
          echo "Created glslang-wasm.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: glslang-${{ matrix.platform }}
          path: ${{ runner.temp }}/output/glslang-${{ matrix.platform }}.*

  # ==================================================================
  #  libfido2 — Yubico's FIDO2/CTAP2 stack (libfido2 + libcbor +
  #  hidapi on Linux + libcrypto). Powers the Fido2Authenticator surface
  #  in libmental — every security key we recognise (YubiKey, Titan,
  #  SoloKey, ...) is enumerated through this static bundle.
  #
  #  macOS/Linux: build libfido2 + libcbor (+ hidapi on Linux) from
  #               source with CMake; bundle the system's libcrypto.a
  #               + openssl headers so libmental compiles cleanly with
  #               no Homebrew shortcut on the consumer side.
  #  Windows:     download Yubico's official prebuilt zip.
  # ==================================================================
  build-libfido2:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [verify-licenses]
    name: "Build libfido2 (${{ matrix.platform }})"
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            runner: macos-14  # ARM64
            platform: darwin-arm64
            macos_arch: arm64
          - os: macos-latest
            runner: macos-14  # Cross-compile x86_64 on ARM64
            platform: darwin-amd64
            macos_arch: x86_64
          - os: ubuntu-latest
            runner: ubuntu-latest
            platform: linux-amd64
          - os: ubuntu-latest
            runner: ubuntu-24.04-arm
            platform: linux-arm64
          - os: ubuntu-latest
            runner: ubuntu-latest
            platform: linux-riscv64
            cross: riscv64
          - os: windows-latest
            runner: windows-latest
            platform: windows-amd64
            msystem: MINGW64
            libfido2_packages: >-
              mingw-w64-x86_64-gcc
              mingw-w64-x86_64-cmake
              mingw-w64-x86_64-make
              mingw-w64-x86_64-pkgconf
              mingw-w64-x86_64-perl
              mingw-w64-x86_64-clang
              mingw-w64-x86_64-lld
          - os: windows-11-arm
            runner: windows-11-arm
            platform: windows-arm64
            msystem: CLANGARM64
            # Native ARM64 build in MSYS2 CLANGARM64 msystem — the
            # same toolchain family libmental itself uses.  Previously
            # libfido2's windows-arm64 tarball was cross-compiled with
            # llvm-mingw, which produced .a files calling clock_gettime
            # while CLANGARM64's <time.h> aliases clock_gettime to
            # clock_gettime64.  Symbol mismatch caused every downstream
            # link of libmental to fail with undefined-symbol errors.
            # Building natively here keeps both sides on identical
            # runtime ABI.
            libfido2_packages: >-
              mingw-w64-clang-aarch64-toolchain
              mingw-w64-clang-aarch64-cmake
              mingw-w64-clang-aarch64-make
              mingw-w64-clang-aarch64-pkgconf
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL + hidapi deps (Linux)
        if: startsWith(matrix.platform, 'linux-')
        run: |
          sudo apt-get update
          # hidapi-hidraw is the only hidapi backend we ship; libudev is
          # needed at BUILD time for enumeration but the resulting
          # libhidapi-hidraw.a only requires libudev.so.1 at runtime,
          # which is universal on any systemd distro.  No libusb.
          sudo apt-get install -y \
              libssl-dev \
              libudev-dev \
              pkg-config \
              cmake

      - name: Install the riscv64 cross toolchain and multiarch libraries (linux-riscv64)
        # The target's libcrypto and libudev come from Ubuntu's ports archive
        # as riscv64 multiarch packages (Debian's way): the runner's own
        # sources are confined to amd64 first, so apt does not look for
        # riscv64 packages where there are none.
        if: matrix.cross == 'riscv64'
        run: |
          set -e
          sudo dpkg --add-architecture riscv64
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            grep -q '^Architectures:' "$f" || sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64/' "$f"
          done
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
            [ -f "$f" ] || continue
            # a bare "deb URL" line, and a "deb [signed-by=…]" line without arch=
            sudo sed -i -E -e 's/^deb ([^[])/deb [arch=amd64] \1/' -e '/^deb \[[^]]*arch=/! s/^deb \[/deb [arch=amd64 /' "$f"
          done
          printf 'Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports\nSuites: noble noble-updates noble-security\nComponents: main universe\nArchitectures: riscv64\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n' | sudo tee /etc/apt/sources.list.d/riscv64-ports.sources >/dev/null
          sudo apt-get update
          # Both architectures of the two dev packages in one request: they are
          # Multi-Arch: same, co-installable only at one version, and the runner
          # image already carries the amd64 ones - apt may have to move those.
          sudo apt-get install -y --no-install-recommends g++-riscv64-linux-gnu libc6-dev-riscv64-cross libstdc++-13-dev-riscv64-cross binutils-riscv64-linux-gnu pkg-config cmake libssl-dev libssl-dev:riscv64 libudev-dev libudev-dev:riscv64 zlib1g-dev zlib1g-dev:riscv64
          ls /usr/lib/riscv64-linux-gnu/libcrypto.a /usr/lib/riscv64-linux-gnu/pkgconfig/libudev.pc /usr/lib/riscv64-linux-gnu/pkgconfig/zlib.pc

      - name: Install OpenSSL (macOS)
        if: startsWith(matrix.platform, 'darwin-')
        run: |
          # macOS runners ship brew + openssl@3 preinstalled, but pin the
          # dep explicitly so a runner-image rev never breaks the build.
          brew install openssl@3 pkg-config cmake

      - name: Setup MSYS2 (Windows)
        if: matrix.msystem
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          cache: true
          install: >-
            ${{ matrix.libfido2_packages }}
            git
            make
            perl

      - name: Build libfido2 (macOS/Linux)
        if: ${{ !startsWith(matrix.platform, 'windows-') }}
        shell: bash
        run: |
          chmod +x scripts/build-libfido2.sh
          BUILD_DIR="${{ runner.temp }}/build" \
          OUTPUT_DIR="${{ runner.temp }}/output" \
          MACOS_ARCH="${{ matrix.macos_arch || '' }}" \
          CMAKE_ARCH="${{ matrix.cross || '' }}" \
          PLATFORM_OVERRIDE="${{ matrix.cross && matrix.platform || '' }}" \
          bash scripts/build-libfido2.sh

      - name: Build libfido2 (Windows — MSYS2 native)
        if: startsWith(matrix.platform, 'windows-')
        shell: msys2 {0}
        run: |
          # Both windows-amd64 (MINGW64 x86_64) and windows-arm64
          # (CLANGARM64 aarch64) build natively in their own msys2
          # environment — no cross-compile, no PATH juggling.
          # PLATFORM_OVERRIDE bypasses uname-based arch detection:
          # msys2/setup-msys2 on windows-11-arm sometimes reports the
          # host arch as x86_64 even inside a CLANGARM64 msystem, and
          # we'd end up with a mingw64 build instead of mingwarm64.
          chmod +x scripts/build-libfido2.sh
          BUILD_DIR="${{ runner.temp }}/build" \
          OUTPUT_DIR="${{ runner.temp }}/output" \
          PLATFORM_OVERRIDE="${{ matrix.platform }}" \
          bash scripts/build-libfido2.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libfido2-${{ matrix.platform }}
          path: ${{ runner.temp }}/output/libfido2-${{ matrix.platform }}.*

  build-spirv-cross:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [verify-licenses]
    name: "Build SPIRV-Cross (${{ matrix.platform }})"
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            runner: macos-14  # ARM64
            platform: darwin-arm64
            macos_arch: arm64
          - os: macos-latest
            runner: macos-14  # Cross-compile x86_64 on ARM64
            platform: darwin-amd64
            macos_arch: x86_64
          - os: ubuntu-latest
            runner: ubuntu-latest
            platform: linux-amd64
          - os: ubuntu-latest
            runner: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-latest
            runner: windows-latest
            platform: windows-amd64
            mingw_arch: x86_64
          - os: windows-latest
            runner: windows-latest
            platform: windows-arm64
            mingw_arch: x86_64
            cross_compile_target: aarch64
          - os: ubuntu-latest
            runner: ubuntu-latest
            platform: linux-riscv64
            cross: riscv64
          - os: ubuntu-latest
            runner: ubuntu-latest
            platform: wasm
            wasm: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MinGW (Windows)
        if: matrix.mingw_arch
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          cache: true
          install: >-
            mingw-w64-${{ matrix.mingw_arch }}-gcc
            mingw-w64-${{ matrix.mingw_arch }}-cmake
            mingw-w64-${{ matrix.mingw_arch }}-ninja
            mingw-w64-${{ matrix.mingw_arch }}-clang
            mingw-w64-${{ matrix.mingw_arch }}-lld
            git
            make

      - name: Cache llvm-mingw
        if: matrix.cross_compile_target == 'aarch64'
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: llvm-mingw-20260311-ucrt-x86_64
          key: llvm-mingw-20260311-ucrt-x86_64

      - name: Download ARM64 MinGW runtime libraries
        if: matrix.cross_compile_target == 'aarch64' && steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Download llvm-mingw which has ARM64 runtime libraries
          curl -L -o llvm-mingw.zip https://github.com/mstorsjo/llvm-mingw/releases/download/20260311/llvm-mingw-20260311-ucrt-x86_64.zip
          unzip -q llvm-mingw.zip

      - name: Setup ARM64 libraries
        if: matrix.cross_compile_target == 'aarch64'
        shell: bash
        run: |
          # Copy ARM64 libraries to a location where the linker can find them (use Windows path)
          mkdir -p D:/a/_temp/msys64/mingw64/aarch64-w64-mingw32
          cp -r llvm-mingw-20260311-ucrt-x86_64/aarch64-w64-mingw32/* D:/a/_temp/msys64/mingw64/aarch64-w64-mingw32/

      - name: Install Emscripten (WASM)
        if: matrix.wasm
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "5.0.1"

      - name: Build SPIRV-Cross (Windows)
        if: matrix.mingw_arch
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          BUILD_DIR="${{ runner.temp }}/build" \
          OUTPUT_DIR="${{ runner.temp }}/output" \
          USE_MINGW=1 \
          CROSS_COMPILE_TARGET="${{ matrix.cross_compile_target || '' }}" \
          bash scripts/build-spirv-cross.sh

      - name: Install the riscv64 cross toolchain (linux-riscv64)
        # The one cross leg among the native platforms: GitHub hosts no
        # riscv64 runner, so ubuntu-latest builds with Ubuntu's own cross
        # toolchain, and the build script takes CMAKE_ARCH=riscv64.
        if: matrix.cross == 'riscv64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-riscv64-linux-gnu libc6-dev-riscv64-cross libstdc++-13-dev-riscv64-cross binutils-riscv64-linux-gnu
          riscv64-linux-gnu-g++ --version | head -1

      - name: Build SPIRV-Cross (macOS/Linux)
        if: ${{ !matrix.mingw_arch && !matrix.wasm }}
        shell: bash
        run: |
          chmod +x scripts/build-spirv-cross.sh
          BUILD_DIR="${{ runner.temp }}/build" \
          OUTPUT_DIR="${{ runner.temp }}/output" \
          MACOS_ARCH="${{ matrix.macos_arch || '' }}" \
          CMAKE_ARCH="${{ matrix.cross || '' }}" \
          bash scripts/build-spirv-cross.sh

      - name: Build SPIRV-Cross (WASM)
        if: matrix.wasm
        shell: bash
        run: |
          # Match build-spirv-cross.sh: filter for Vulkan SDK release tags, not
          # whatever GitHub returns as the first tag (which can be a lightweight
          # intermediate tag or empty on rate-limit).
          SPIRV_CROSS_VERSION=$(curl -sSLf -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/KhronosGroup/SPIRV-Cross/tags | grep '"name"' | grep 'vulkan-sdk-' | head -1 | sed -E 's/.*"name": "([^"]+)".*/\1/')
          if [ -z "$SPIRV_CROSS_VERSION" ]; then
            echo "Error: could not determine latest SPIRV-Cross vulkan-sdk tag (rate-limited?)"
            exit 1
          fi
          echo "Building SPIRV-Cross $SPIRV_CROSS_VERSION for WASM..."

          mkdir -p wasm-build-spirv && cd wasm-build-spirv
          git clone --depth 1 --branch "$SPIRV_CROSS_VERSION" https://github.com/KhronosGroup/SPIRV-Cross.git
          cd SPIRV-Cross && mkdir -p build && cd build

          emcmake cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DSPIRV_CROSS_CLI=OFF \
            -DSPIRV_CROSS_ENABLE_TESTS=OFF \
            -DSPIRV_CROSS_SHARED=OFF \
            -DSPIRV_CROSS_STATIC=ON

          emmake cmake --build . --config Release -j$(nproc)

          # Package — match native archive layout (headers + libs at root)
          PACKAGE_DIR="${{ runner.temp }}/output/spirv-cross-wasm"
          mkdir -p "$PACKAGE_DIR"

          # Libraries at root
          find . -name "*.a" -exec cp {} "$PACKAGE_DIR/" \;

          # Headers at root (same layout as native archives)
          cd "${{ github.workspace }}/wasm-build-spirv/SPIRV-Cross"
          cp spirv_cross_c.h spirv.hpp spirv_cross.hpp spirv_glsl.hpp \
             spirv_hlsl.hpp spirv_msl.hpp spirv_common.hpp spirv_cfg.hpp \
             spirv_parser.hpp spirv_cross_parsed_ir.hpp spirv_cross_containers.hpp \
             spirv_cross_error_handling.hpp spirv.h spirv_cpp.hpp \
             "$PACKAGE_DIR/" 2>/dev/null || true

          # License
          cp LICENSE "$PACKAGE_DIR/LICENSE"

          cd "${{ runner.temp }}/output"
          tar -czf "spirv-cross-wasm.tar.gz" "spirv-cross-wasm"
          echo "Created spirv-cross-wasm.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spirv-cross-${{ matrix.platform }}
          path: ${{ runner.temp }}/output/spirv-cross-${{ matrix.platform }}.*

  # Mesa's spirv-to-dxil — SPIR-V → DXIL compiler for the D3D12 backend.
  # MIT-licensed, NIR-based (no LLVM dependency), ~5-15 MB static archive.
  # Replaces the DXC subprocess invocation that was libmental's old
  # HLSL → DXIL stage; libmental can now feed SPIR-V (already its hub
  # format) directly to D3D12 via this library.
  #
  # Built for Linux (amd64 + arm64) and Windows (amd64 + arm64).  D3D12
  # is Windows-only at runtime — Surface Pro X / Snapdragon X Elite
  # ARM64 Windows machines are first-class D3D12 hosts, so we build for
  # arm64 too — and Linux gets the artifact as build-validation cover.
  # macOS and WASM are skipped: Mesa's microsoft/compiler subtree pulls
  # in <malloc.h> which doesn't exist on Apple, and neither platform
  # has a D3D12 backend at runtime.
  #
  # Windows ARM64 builds NATIVELY on the windows-11-arm runner via
  # MSYS2's CLANGARM64 subsystem (no cross-compile gymnastics required).
  build-mesa-spirv-to-dxil:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [verify-licenses]
    name: "Build Mesa spirv-to-dxil (${{ matrix.platform }})"
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
            platform: linux-amd64
          - os: ubuntu-latest
            runner: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-latest
            runner: windows-latest
            platform: windows-amd64
            msys_subsystem: MINGW64
            mingw_pkg_prefix: x86_64
          - os: windows-latest
            runner: windows-11-arm
            platform: windows-arm64
            msys_subsystem: CLANGARM64
            mingw_pkg_prefix: clang-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Linux: install ninja + python3 from apt.  Meson comes from pip,
      # NOT apt — Ubuntu 24.04 (ubuntu-latest as of this writing) ships
      # meson 1.3.2 via apt, but Mesa 26.0.6 requires meson >= 1.4.0.
      # pip3 install lands in $HOME/.local/bin, which we surface via
      # $GITHUB_PATH so subsequent steps (and the build script's
      # `command -v meson` check) find it ahead of any system meson.
      #
      # Mesa's meson build also wants the python `mako` and `pyyaml`
      # packages; the build script pip-installs those defensively.
      - name: Setup Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 python3-pip
          pip3 install --user --break-system-packages "meson>=1.4.0"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Windows: pacman packages for the matching MSYS2 subsystem.
      #   MINGW64    on x86_64 → mingw-w64-x86_64-*       (gcc toolchain)
      #   CLANGARM64 on arm64  → mingw-w64-clang-aarch64-* (clang toolchain;
      #                          no native gcc cross to ARM64 in MSYS2)
      # Both subsystems ship meson, ninja, python, and the python-{mako,
      # yaml,packaging} modules Mesa's build helpers need.
      #
      # python-packaging is load-bearing: Mesa's meson.build does
      #   from packaging.version import Version
      #   except: from distutils.version import StrictVersion
      # but distutils was REMOVED from Python's stdlib in 3.12.  Python
      # 3.14 (what MSYS2 currently ships) hits the except, finds no
      # distutils either, and aborts.  Installing python-packaging is
      # the modern path.
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msys_subsystem }}
          update: false
          cache: true
          install: >-
            mingw-w64-${{ matrix.mingw_pkg_prefix }}-cc
            mingw-w64-${{ matrix.mingw_pkg_prefix }}-meson
            mingw-w64-${{ matrix.mingw_pkg_prefix }}-ninja
            mingw-w64-${{ matrix.mingw_pkg_prefix }}-python
            mingw-w64-${{ matrix.mingw_pkg_prefix }}-python-mako
            mingw-w64-${{ matrix.mingw_pkg_prefix }}-python-yaml
            mingw-w64-${{ matrix.mingw_pkg_prefix }}-python-packaging
            git

      - name: Build Mesa spirv-to-dxil (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x scripts/build-mesa-spirv-to-dxil.sh
          BUILD_DIR="${{ runner.temp }}/build" \
          OUTPUT_DIR="${{ runner.temp }}/output" \
          MENTAL_PLATFORM="${{ matrix.platform }}" \
          bash scripts/build-mesa-spirv-to-dxil.sh

      - name: Build Mesa spirv-to-dxil (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          BUILD_DIR="${{ runner.temp }}/build" \
          OUTPUT_DIR="${{ runner.temp }}/output" \
          MENTAL_PLATFORM="${{ matrix.platform }}" \
          bash scripts/build-mesa-spirv-to-dxil.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spirv-to-dxil-${{ matrix.platform }}
          path: ${{ runner.temp }}/output/spirv-to-dxil-${{ matrix.platform }}.tar.gz

  build-llvm:
    needs: [verify-licenses, determine-shas]
    name: "Build LLVM (${{ matrix.platform }})"
    strategy:
      # Not fail-fast: each leg is an hour or more of cold LLVM build whose
      # cache is only saved when the job succeeds, and the checks that can
      # fail a leg (package-clang.sh's verifications) run at its END. v0.0.84
      # lost six finished builds to one leg's packaging check; let the others
      # complete and cache, and let create-release refuse the short set.
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
            macos_arch: arm64
          - runner: macos-14
            platform: darwin-amd64
            macos_arch: x86_64
          - runner: ubuntu-latest
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-latest
            platform: windows-amd64
            msys_subsystem: UCRT64
            mingw_pkg_prefix: x86_64
          - runner: windows-11-arm
            platform: windows-arm64
            msys_subsystem: CLANGARM64
            mingw_pkg_prefix: clang-aarch64
          # The one cross leg among the native platforms: GitHub hosts no
          # riscv64 runner, so ubuntu-latest builds linux-riscv64 with Ubuntu's
          # own cross toolchain (scripts/common.sh's IS_CROSS - the two-phase
          # shape wasm has) and runs what it built under qemu-user; board.yml
          # then proves the artifacts on a VisionFive 2.
          - runner: ubuntu-latest
            platform: linux-riscv64
            cross: riscv64
          - runner: ubuntu-latest
            platform: wasm
            wasm: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache LLVM build
        id: cache-llvm
        uses: actions/cache@v4
        with:
          # Both deliverables of one build: the dev kit and, on the seven
          # native platforms, the slim clang asset plus its report. The
          # clang glob matches nothing on wasm, which actions/cache
          # tolerates as long as one path matches. A cache hit skips the
          # build; the "Package slim clang from the cached dev kit" steps
          # below then make the asset again from the restored dev kit, so
          # the clang upload never depends on what a cache happens to hold
          # (v0.0.85's caches hold both; an older or hand-made one may not).
          path: |
            ${{ runner.temp }}/output/llvm-${{ matrix.platform }}.*
            ${{ runner.temp }}/output/clang-${{ matrix.platform }}.*
          # Include the resolved LLVM SHA so a clspv bump (which changes the
          # SHA) invalidates the cache automatically — otherwise we'd ship
          # stale LLVM against a clspv that expects new APIs.
          # `mingw_pkg_prefix` busts the cache when the Windows toolchain
          # changes (e.g. windows-arm64 switching from x86_64-UCRT64 to
          # clang-aarch64-CLANGARM64) — without this, the existing cache
          # would serve a binary built for the wrong arch.  Empty on
          # non-Windows platforms; doesn't affect their key uniqueness
          # since matrix.platform is already distinct.
          # package-clang.sh is in the key because it decides what the
          # cached clang asset contains.
          key: llvm-${{ matrix.platform }}-${{ needs.determine-shas.outputs.llvm_sha }}-${{ matrix.mingw_pkg_prefix }}-${{ hashFiles('scripts/build-llvm.sh', 'scripts/common.sh', 'scripts/package-clang.sh') }}

      - name: Install the riscv64 cross toolchain (linux-riscv64)
        # Ubuntu's cross gcc with the -cross libc and libstdc++ (static
        # libstdc++ comes from the -dev package), binutils for the target,
        # and qemu-user-static, whose binfmt_misc registration lets the
        # target's binaries run here transparently (QEMU_LD_PREFIX, set by
        # scripts/common.sh, points qemu at the cross libc's loader), and
        # ninja, the one generator that honours LLVM's link-job cap. Not gated on the cache: the
        # cache-hit packaging below runs the restored asset under qemu too.
        if: matrix.cross == 'riscv64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-riscv64-linux-gnu libc6-dev-riscv64-cross libstdc++-13-dev-riscv64-cross binutils-riscv64-linux-gnu qemu-user-static ninja-build
          riscv64-linux-gnu-g++ --version | head -1
          qemu-riscv64-static --version | head -1
          ninja --version

      - name: Install dependencies (Linux ARM64)
        if: steps.cache-llvm.outputs.cache-hit != 'true' && matrix.platform == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-11 g++-11
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100

      - name: Install MinGW (Windows)
        # windows-amd64 uses UCRT64 (x86_64 GCC + LLVM tools); windows-arm64
        # uses CLANGARM64 (native arm64 Clang + LLD).  Each subsystem ships
        # its own per-prefix package set — packages installed here MUST
        # match the subsystem, otherwise pacman silently downloads the wrong
        # arch and the resulting artifact contains x86_64 binaries
        # mislabeled as arm64 (the bug v0.0.67 shipped with).
        if: steps.cache-llvm.outputs.cache-hit != 'true' && runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msys_subsystem }}
          install: >-
            mingw-w64-${{ matrix.mingw_pkg_prefix }}-cmake
            mingw-w64-${{ matrix.mingw_pkg_prefix }}-ninja
            mingw-w64-${{ matrix.mingw_pkg_prefix }}-python
            mingw-w64-${{ matrix.mingw_pkg_prefix }}-clang
            mingw-w64-${{ matrix.mingw_pkg_prefix }}-lld
            git
            make

      - name: Install Emscripten (WASM)
        if: steps.cache-llvm.outputs.cache-hit != 'true' && matrix.wasm
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "5.0.1"

      # Both build steps package the slim clang at their end (build-llvm.sh
      # → package-clang.sh) under the cap the workflow-level env sets,
      # CLANG_ASSET_MAX_BYTES (160 MiB; the script's own default is the
      # gameplan's 100 MiB, which v0.0.85's Linux assets outgrew).
      - name: Build LLVM (Unix)
        if: steps.cache-llvm.outputs.cache-hit != 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/build-llvm.sh
          BUILD_DIR="${{ runner.temp }}/build" \
          OUTPUT_DIR="${{ runner.temp }}/output" \
          MACOS_ARCH="${{ matrix.macos_arch || '' }}" \
          WASM_BUILD="${{ matrix.wasm && '1' || '0' }}" \
          LLVM_SHA="${{ needs.determine-shas.outputs.llvm_sha }}" \
          MENTAL_PLATFORM="${{ matrix.platform }}" bash scripts/build-llvm.sh

      - name: Build LLVM (Windows)
        if: steps.cache-llvm.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          chmod +x scripts/build-llvm.sh
          BUILD_DIR="${{ runner.temp }}/build" \
          OUTPUT_DIR="${{ runner.temp }}/output" \
          LLVM_SHA="${{ needs.determine-shas.outputs.llvm_sha }}" \
          MENTAL_PLATFORM="${{ matrix.platform }}" bash scripts/build-llvm.sh

      # A cache hit skipped the build, and the cache holds the dev kit
      # (llvm-<platform>.tar.gz) - whether it also holds a slim asset is
      # the cache's business, not the release's. The seven native legs make
      # clang-<platform>.tar.gz again from the restored dev kit, with the
      # same package-clang.sh over the same bytes (the kit's bin/ tools and
      # builtin headers, its VERSION, the license texts of its bundled src/
      # tree; see scripts/package-clang-from-devkit.sh), so the upload
      # below always has an asset and the cap is applied by this run.
      # Inputs are the step's env; every missing piece fails the step.
      - name: Set up MSYS2 for packaging (Windows, cache hit)
        # The build's MSYS2 (Install MinGW above) is skipped on a cache hit,
        # and `shell: msys2 {0}` needs the action to have run. The packaging
        # needs only MSYS2's base tools from the host - bash, tar, gzip,
        # coreutils, findutils, gawk, grep, sed - named here so `pacman -S
        # --needed` proves them present at no cost; llvm-strip and
        # llvm-readobj come out of the dev kit itself. Same msystem as the
        # build, so uname and the PATH prefix agree with the cold path.
        if: steps.cache-llvm.outputs.cache-hit == 'true' && runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msys_subsystem }}
          install: >-
            tar
            gzip
            coreutils
            findutils
            gawk
            grep
            sed

      - name: Package slim clang from the cached dev kit (Unix)
        if: steps.cache-llvm.outputs.cache-hit == 'true' && matrix.platform != 'wasm' && runner.os != 'Windows'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          OUTPUT_DIR: ${{ runner.temp }}/output
          WORK_DIR: ${{ runner.temp }}/devkit
          LLVM_SHA: ${{ needs.determine-shas.outputs.llvm_sha }}
          # CLANG_ASSET_MAX_BYTES: the workflow-level env, same as the build.
          # The cross leg's asset runs here under qemu-user (binfmt_misc, from
          # the install step above): the cross libc's loader for qemu, and the
          # execution checks required rather than skipped.
          QEMU_LD_PREFIX: ${{ matrix.cross == 'riscv64' && '/usr/riscv64-linux-gnu' || '' }}
          PACKAGE_CLANG_REQUIRE_EXEC: ${{ matrix.cross && '1' || '0' }}
        run: bash scripts/package-clang-from-devkit.sh

      - name: Package slim clang from the cached dev kit (Windows)
        if: steps.cache-llvm.outputs.cache-hit == 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        env:
          PLATFORM: ${{ matrix.platform }}
          OUTPUT_DIR: ${{ runner.temp }}/output
          WORK_DIR: ${{ runner.temp }}/devkit
          LLVM_SHA: ${{ needs.determine-shas.outputs.llvm_sha }}
          # CLANG_ASSET_MAX_BYTES: the workflow-level env, same as the build.
        run: bash scripts/package-clang-from-devkit.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-${{ matrix.platform }}
          path: ${{ runner.temp }}/output/llvm-${{ matrix.platform }}.*

      # The slim clang asset — clang-<platform>.tar.gz — comes out of the
      # same build (scripts/package-clang.sh, run by build-llvm.sh on the
      # native platforms, or by the cache-hit steps above over the cached
      # dev kit) and its report .txt rides along for the release job's
      # summary. A missing tarball is an error, never a silent skip: a
      # release without all seven is a release e cannot pin.
      - name: Upload slim clang
        if: matrix.platform != 'wasm'
        uses: actions/upload-artifact@v4
        with:
          name: clang-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/output/clang-${{ matrix.platform }}.tar.gz
            ${{ runner.temp }}/output/clang-${{ matrix.platform }}.report.txt
          if-no-files-found: error

  build-clspv:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [build-llvm, determine-shas]
    name: "Build clspv (${{ matrix.platform }})"
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-14
            platform: darwin-arm64
            macos_arch: arm64
          - runner: macos-14
            platform: darwin-amd64
            macos_arch: x86_64
          - runner: ubuntu-latest
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: windows-latest
            platform: windows-amd64
            msys_subsystem: UCRT64
            mingw_pkg_prefix: x86_64
          - runner: windows-11-arm
            platform: windows-arm64
            msys_subsystem: CLANGARM64
            mingw_pkg_prefix: clang-aarch64
          # The one cross leg among the native platforms: GitHub hosts no
          # riscv64 runner, so ubuntu-latest builds linux-riscv64 with Ubuntu's
          # own cross toolchain (scripts/common.sh's IS_CROSS - the two-phase
          # shape wasm has) and runs what it built under qemu-user; board.yml
          # then proves the artifacts on a VisionFive 2.
          - runner: ubuntu-latest
            platform: linux-riscv64
            cross: riscv64
          - runner: ubuntu-latest
            platform: wasm
            wasm: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache clspv build
        id: cache-clspv
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/output/clspv-${{ matrix.platform }}.*
          # Key composition:
          #   - platform: separate cache per target
          #   - clspv_sha: rebuild when clspv main moves
          #   - llvm_sha:  rebuild when LLVM (the linkage substrate) moves,
          #                even if clspv itself didn't change — clspv
          #                links against LLVM's internal headers and ABIs
          #   - script hashes: rebuild when our build recipe changes
          # All four dimensions are necessary; dropping any one ships
          # mismatched binaries.
          # mingw_pkg_prefix busts the cache when the Windows toolchain
          # changes (see matching comment in build-llvm's cache step).
          key: clspv-${{ matrix.platform }}-${{ needs.determine-shas.outputs.clspv_sha }}-${{ needs.determine-shas.outputs.llvm_sha }}-${{ matrix.mingw_pkg_prefix }}-${{ hashFiles('scripts/build-clspv.sh', 'scripts/common.sh') }}

      # Everything below is gated on cache miss — on a hit the cached
      # tarball already lives at $RUNNER_TEMP/output and we skip straight
      # to the upload step.  Notably this means we ALSO skip the LLVM
      # download/extract on cache hit (~2 GB transfer + decompress saved).

      - name: Download LLVM
        if: steps.cache-clspv.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: llvm-${{ matrix.platform }}
          path: artifacts

      - name: Extract LLVM
        if: steps.cache-clspv.outputs.cache-hit != 'true'
        run: tar -xzf artifacts/llvm-${{ matrix.platform }}.tar.gz

      - name: Install the riscv64 cross toolchain (linux-riscv64)
        # Ubuntu's cross gcc with the -cross libc and libstdc++ (static
        # libstdc++ comes from the -dev package), binutils for the target,
        # and qemu-user-static, whose binfmt_misc registration lets the
        # target's binaries run here transparently (QEMU_LD_PREFIX, set by
        # scripts/common.sh, points qemu at the cross libc's loader), and
        # ninja, the one generator that honours LLVM's link-job cap.
        if: steps.cache-clspv.outputs.cache-hit != 'true' && matrix.cross == 'riscv64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-riscv64-linux-gnu libc6-dev-riscv64-cross libstdc++-13-dev-riscv64-cross binutils-riscv64-linux-gnu qemu-user-static ninja-build
          riscv64-linux-gnu-g++ --version | head -1
          qemu-riscv64-static --version | head -1
          ninja --version

      - name: Setup Python
        if: steps.cache-clspv.outputs.cache-hit != 'true' && runner.os != 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MinGW (Windows)
        # Must match the toolchain LLVM was built with — UCRT64 on
        # windows-amd64, CLANGARM64 on windows-arm64.  Mismatching
        # subsystems means LLVM's CRT-decorated symbols (e.g.
        # __imp__setjmp) won't resolve, OR the clspv compile picks up
        # the wrong arch.
        if: steps.cache-clspv.outputs.cache-hit != 'true' && runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msys_subsystem }}
          install: >-
            mingw-w64-${{ matrix.mingw_pkg_prefix }}-cmake
            mingw-w64-${{ matrix.mingw_pkg_prefix }}-ninja
            mingw-w64-${{ matrix.mingw_pkg_prefix }}-python
            mingw-w64-${{ matrix.mingw_pkg_prefix }}-clang
            mingw-w64-${{ matrix.mingw_pkg_prefix }}-lld
            git
            make

      - name: Install Emscripten (WASM)
        if: steps.cache-clspv.outputs.cache-hit != 'true' && matrix.wasm
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "5.0.1"

      - name: Build clspv (Unix)
        if: steps.cache-clspv.outputs.cache-hit != 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/build-clspv.sh
          BUILD_DIR="${{ runner.temp }}/build" \
          OUTPUT_DIR="${{ runner.temp }}/output" \
          LLVM_BUILD_DIR="$(pwd)/llvm-${{ matrix.platform }}" \
          WASM_BUILD="${{ matrix.wasm && '1' || '0' }}" \
          MACOS_ARCH="${{ matrix.macos_arch || '' }}" \
          CLSPV_SHA="${{ needs.determine-shas.outputs.clspv_sha }}" \
          MENTAL_PLATFORM="${{ matrix.platform }}" bash scripts/build-clspv.sh

      - name: Build clspv (Windows)
        if: steps.cache-clspv.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          chmod +x scripts/build-clspv.sh
          BUILD_DIR="${{ runner.temp }}/build" \
          OUTPUT_DIR="${{ runner.temp }}/output" \
          LLVM_BUILD_DIR="$(pwd)/llvm-${{ matrix.platform }}" \
          CLSPV_SHA="${{ needs.determine-shas.outputs.clspv_sha }}" \
          MENTAL_PLATFORM="${{ matrix.platform }}" bash scripts/build-clspv.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clspv-${{ matrix.platform }}
          path: ${{ runner.temp }}/output/clspv-${{ matrix.platform }}.*

